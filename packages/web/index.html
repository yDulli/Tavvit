<!DOCTYPE html>
<html lang="en" data-theme="orbit">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Defence in depth only. The server sends the full policy as a header,
         built from instance config (see docs/systems/web-security.md). A meta
         policy INTERSECTS with the header rather than replacing it, so this
         carries only the directives that never depend on runtime config.
         Adding connect-src, img-src or frame-src here would silently block
         whatever the server policy allows and this copy has gone stale on.

         worker-src is listed even though the header also carries it, because
         worker-src falls back to script-src when it is absent. Without it this
         tag blocks the blob-URL Worker that runs the WebSocket keepalive in
         src/hooks/useWebSocket.ts, and the block is silent apart from a console
         entry. child-src is deliberately not listed: frame-src falls back to it,
         and the embed origins are server-owned config that must not appear here. -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" />
    <meta name="description" content="Tavvit is a home for your friends and communities: channels, direct messages, voice and screen sharing in one quick, quiet app. No ads, no trackers." />
    <!-- What a chat app shows for a link to any address of the app (an invite link
         rewrites it for its space: server/src/utils/webDocument.ts). The website's
         pages have their own head (site/layouts/SiteDocument.astro); the server
         gives both pictures a whole address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tavvit" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Tavvit: group chat with channels, voice and screen sharing" />
    <meta property="og:description" content="A home for your friends and communities: channels, direct messages, voice and screen sharing. No ads, no trackers." />
    <meta property="og:image" content="/social-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tavvit: make room for your people. Channels, voice, screen sharing and direct messages in one app." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tavvit: group chat with channels, voice and screen sharing" />
    <meta name="twitter:description" content="A home for your friends and communities: channels, direct messages, voice and screen sharing. No ads, no trackers." />
    <meta name="twitter:image" content="/social-card.jpg" />
    <meta name="twitter:image:alt" content="Tavvit: make room for your people. Channels, voice, screen sharing and direct messages in one app." />
    <meta name="theme-color" content="#0d0e11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tavvit" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/Geist-Latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Tavvit</title>
  </head>
  <body class="bg-surface-base text-txt-primary">
    <div id="root">
      <div class="boot-mark" aria-hidden="true"><img src="/icons/logo-mark.svg" alt="" /></div>
      <noscript>
        <p>Tavvit is a home for your friends and communities: channels, direct messages, voice and screen sharing in one app. It needs JavaScript to run.</p>
        <p><a href="/imprint">Legal notice</a> · <a href="/privacy">Privacy policy</a> · <a href="/terms">Terms of use</a></p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
