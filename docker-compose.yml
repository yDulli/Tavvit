# ============================================================
# Tavvit — All-in-one production deployment
# ============================================================
# Run ./install.sh for first-time setup, or configure manually:
#   1. Copy .env.example to .env and fill in values
#   2. Generate livekit.yaml (if enabling voice)
#   3. docker compose up -d --build
#   4. ./tavvit-admin.sh create <username> --admin     (registration is closed)
#
# The compose service and container are still called `backspace`. That is an
# internal name, kept so the upstream scripts (update.sh, backup.sh, restore.sh)
# and future upstream merges keep working; nothing a user sees uses it.
# ============================================================

services:
  # ── Tavvit application server ──────────────────────────────
  backspace:
    # Tavvit is built from this checkout and tagged `tavvit:local`. There is no
    # public Tavvit image: the one upstream publishes on GHCR is Backspace, a
    # different program, so it is never pulled. `pull_policy: never` stops Compose
    # from asking any registry for the name `tavvit`, which nobody here controls.
    #
    # To run an image you publish yourself, set in .env:
    #   BACKSPACE_IMAGE=ghcr.io/<you>/tavvit  BACKSPACE_IMAGE_TAG=<tag>
    #   BACKSPACE_PULL_POLICY=missing
    # and install with BACKSPACE_BUILD=false (see install.sh).
    image: ${BACKSPACE_IMAGE:-tavvit}:${BACKSPACE_IMAGE_TAG:-local}
    pull_policy: ${BACKSPACE_PULL_POLICY:-never}
    build:
      context: .
      args:
        # AGPL-3.0 § 13: bake the running build's id (git commit, or the id of an
        # uploaded release) into the image so /api/instance/info advertises the
        # exact version. install.sh and update.sh pass it as a build argument;
        # empty when unset.
        BACKSPACE_COMMIT: ${BACKSPACE_COMMIT:-}
    container_name: backspace
    restart: unless-stopped
    # Bounded, because the privacy policy says so (docs/systems/legal.md).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/backspace.db
      - UPLOAD_DIR=/app/data/uploads
      # Fail fast with a clear message if the secret is missing/empty, instead of
      # letting the container boot-crash on every `restart: unless-stopped` cycle
      # (a silent loop that only shows up in `docker compose logs backspace`).
      # install.sh generates this before bringing the stack up; this guard only
      # bites the manual `cp .env.example .env && docker compose up` path.
      - "JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env - generate one with: openssl rand -hex 32}"
      # Where the server itself reaches LiveKit, to put someone out of a call. Caddy reaches it the
      # same way; the public LIVEKIT_URL has a path LiveKit's client would drop.
      - LIVEKIT_API_URL=${LIVEKIT_API_URL:-http://host.docker.internal:7880}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:' + (process.env.PORT || 3000) + '/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Caddy reverse proxy (auto-HTTPS) ─────────────────────
  caddy:
    image: caddy:2.11.1-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy-sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    depends_on:
      backspace:
        condition: service_healthy

  # ── LiveKit voice/video server ────────────────────────────
  # Activated by COMPOSE_PROFILES=voice in .env
  livekit:
    image: livekit/livekit-server:v1.9.11
    container_name: livekit
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml
    profiles:
      - voice

  # ── LibreTranslate: translates messages on this server ───
  # Activated by COMPOSE_PROFILES=translate in .env, with TRANSLATION_PROVIDER=libretranslate
  # (docs/systems/translation.md). It has no port outside: only the app reaches it. The first
  # start downloads the languages, which takes a while and several gigabytes.
  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    container_name: libretranslate
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # The languages messages can be translated into. Set LT_LOAD_ONLY= (empty) in .env for all it has.
      - LT_LOAD_ONLY=${LT_LOAD_ONLY-ar,bg,cs,da,de,el,en,es,fi,fr,hu,id,it,ja,ko,nl,pl,pt,ro,ru,sv,tr,uk,zh}
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30m
    profiles:
      - translate

networks:
  internal:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  libretranslate-models:
